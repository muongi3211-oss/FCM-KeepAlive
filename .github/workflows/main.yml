name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-generate missing Gradle configs
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOSITORIES); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
            echo 'rootProject.name = "FCM-KeepAlive"' >> settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi

          if [ ! -f build.gradle.kts ]; then
            echo 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }' > build.gradle.kts
          fi

          mkdir -p app
          if [ ! -f app/build.gradle.kts ]; then
            cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.fcmkeepalive"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.fcmkeepalive"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF
          fi

      - name: Setup Gradle Wrapper
        run: gradle wrapper

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FCM-KeepAlive-APK
          path: app/build/outputs/apk/debug/app-debug.apk
