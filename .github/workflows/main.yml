name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-generate clean Gradle configs & Source
        run: |
          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\nrootProject.name = "FCM-KeepAlive"\ninclude(":app")\n' > settings.gradle.kts

          echo 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }' > build.gradle.kts

          mkdir -p app/src/main/java/com/example/fcmkeepalive
          mkdir -p app/src/main/res/layout

          printf 'plugins {\n    id("com.android.application")\n    id("org.jetbrains.kotlin.android")\n}\n\nandroid {\n    namespace = "com.example.fcmkeepalive"\n    compileSdk = 34\n\n    defaultConfig {\n        applicationId = "com.example.fcmkeepalive"\n        minSdk = 26\n        targetSdk = 34\n        versionCode = 2\n        versionName = "2.0"\n    }\n\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\n\ndependencies {\n    implementation("androidx.core:core-ktx:1.12.0")\n    implementation("androidx.appcompat:appcompat:1.6.1")\n    implementation("com.google.android.material:material:1.11.0")\n}\n' > app/build.gradle.kts

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="FCM KeepAlive"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeepAliveService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Maintain FCM background connection" />
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#121212"
              android:padding="24dp">

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Trạng thái: ĐANG DỰA TRÊN FOREGROUND SERVICE"
                  android:textColor="#4CAF50"
                  android:textSize="16sp"
                  android:textStyle="bold"
                  android:gravity="center"/>

              <Button
                  android:id="@+id/btnToggle"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="32dp"
                  android:text="KHỞI CHẠY LẠI DỊCH VỤ GMS"
                  android:padding="12dp" />

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/fcmkeepalive/KeepAliveService.kt
          package com.example.fcmkeepalive

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import java.io.OutputStream
          import java.net.Socket

          class KeepAliveService : Service() {

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val notification = createNotification()
                  startForeground(1001, notification)

                  // Ping nhe ket noi
                  Thread {
                      try {
                          val socket = Socket("mtalk.google.com", 5228)
                          socket.soTimeout = 3000
                          val out: OutputStream = socket.getOutputStream()
                          out.write(byteArrayOf(0))
                          out.flush()
                          socket.close()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }.start()

                  return START_STICKY
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "fcm_keepalive_channel",
                          "FCM KeepAlive Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }

              private fun createNotification(): Notification {
                  return NotificationCompat.Builder(this, "fcm_keepalive_channel")
                      .setContentTitle("FCM KeepAlive")
                      .setContentText("Đang duy trì kết nối GMS ngầm ưu tiên cao")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setOngoing(true)
                      .build()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/fcmkeepalive/MainActivity.kt
          package com.example.fcmkeepalive

          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate()
                  setContentView(R.layout.activity_main)

                  val btnToggle = findViewById<Button>(R.id.btnToggle)
                  val tvStatus = findViewById<TextView>(R.id.tvStatus)

                  startKeepAliveService()

                  btnToggle.setOnClickListener {
                      startKeepAliveService()
                      tvStatus.text = "Trạng thái: ĐÃ LÀM MỚI KẾT NỐI GMS"
                  }
              }

              private fun startKeepAliveService() {
                  val intent = Intent(this, KeepAliveService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/fcmkeepalive/BootReceiver.kt
          package com.example.fcmkeepalive

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      val serviceIntent = Intent(context, KeepAliveService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(serviceIntent)
                      } else {
                          context.startService(serviceIntent)
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FCM-KeepAlive-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          
