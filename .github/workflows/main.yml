name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-generate clean Gradle configs & Source
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties

          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\nrootProject.name = "FCM-KeepAlive"\ninclude(":app")\n' > settings.gradle.kts

          echo 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }' > build.gradle.kts

          mkdir -p app/src/main/java/com/example/fcmkeepalive
          mkdir -p app/src/main/res/layout

          printf 'plugins {\n    id("com.android.application")\n    id("org.jetbrains.kotlin.android")\n}\n\nandroid {\n    namespace = "com.example.fcmkeepalive"\n    compileSdk = 34\n\n    defaultConfig {\n        applicationId = "com.example.fcmkeepalive"\n        minSdk = 26\n        targetSdk = 34\n        versionCode = 2\n        versionName = "2.0"\n    }\n\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\n\ndependencies {\n    implementation("androidx.core:core-ktx:1.12.0")\n    implementation("androidx.appcompat:appcompat:1.6.1")\n    implementation("com.google.android.material:material:1.11.0")\n}\n' > app/build.gradle.kts

          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application\n        android:allowBackup="true"\n        android:icon="@mipmap/ic_launcher"\n        android:label="FCM KeepAlive"\n        android:roundIcon="@mipmap/ic_launcher_round"\n        android:supportsRtl="true"\n        android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">\n        <activity\n            android:name=".MainActivity"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n        <service\n            android:name=".KeepAliveService"\n            android:enabled="true"\n            android:exported="false" />\n    </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

          printf '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    android:layout_width="match_parent"\n    android:layout_height="match_parent"\n    android:orientation="vertical"\n    android:gravity="center"\n    android:background="#121212"\n    android:padding="24dp">\n    <TextView\n        android:id="@+id/tvStatus"\n        android:layout_width="wrap_content"\n        android:layout_height="wrap_content"\n        android:text="Trạng thái: FOREGROUND SERVICE ĐANG CHẠY"\n        android:textColor="#4CAF50"\n        android:textSize="16sp"\n        android:textStyle="bold"\n        android:gravity="center"/>\n    <Button\n        android:id="@+id/btnToggle"\n        android:layout_width="match_parent"\n        android:layout_height="wrap_content"\n        android:layout_marginTop="32dp"\n        android:text="LÀM MỚI KẾT NỐI GMS"\n        android:padding="12dp" />\n</LinearLayout>\n' > app/src/main/res/layout/activity_main.xml

          printf 'package com.example.fcmkeepalive\n\nimport android.app.Notification\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.app.Service\nimport android.content.Intent\nimport android.os.Build\nimport android.os.IBinder\nimport androidx.core.app.NotificationCompat\nimport java.io.OutputStream\nimport java.net.Socket\n\nclass KeepAliveService : Service() {\n    override fun onBind(intent: Intent?): IBinder? = null\n\n    override fun onCreate() {\n        super.onCreate()\n        createNotificationChannel()\n    }\n\n    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n        val notification = createNotification()\n        startForeground(1001, notification)\n\n        Thread {\n            try {\n                val socket = Socket("mtalk.google.com", 5228)\n                socket.soTimeout = 3000\n                val out: OutputStream = socket.getOutputStream()\n                out.write(byteArrayOf(0))\n                out.flush()\n                socket.close()\n            } catch (e: Exception) {\n                e.printStackTrace()\n            }\n        }.start()\n\n        return START_STICKY\n    }\n\n    private fun createNotificationChannel() {\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            val channel = NotificationChannel(\n                "fcm_keepalive_channel",\n                "FCM KeepAlive Service",\n                NotificationManager.IMPORTANCE_LOW\n            )\n            val manager = getSystemService(NotificationManager::class.java)\n            manager?.createNotificationChannel(channel)\n        }\n    }\n\n    private fun createNotification(): Notification {\n        return NotificationCompat.Builder(this, "fcm_keepalive_channel")\n            .setContentTitle("FCM KeepAlive")\n            .setContentText("Đang duy trì kết nối GMS ngầm ưu tiên cao")\n            .setSmallIcon(android.R.drawable.stat_notify_sync)\n            .setPriority(NotificationCompat.PRIORITY_LOW)\n            .setOngoing(true)\n            .build()\n    }\n}\n' > app/src/main/java/com/example/fcmkeepalive/KeepAliveService.kt

          printf 'package com.example.fcmkeepalive\n\nimport android.content.Intent\nimport android.os.Build\nimport android.os.Bundle\nimport android.widget.Button\nimport android.widget.TextView\nimport androidx.appcompat.app.AppCompatActivity\n\nclass MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate()\n        setContentView(R.layout.activity_main)\n\n        val btnToggle = findViewById<Button>(R.id.btnToggle)\n        val tvStatus = findViewById<TextView>(R.id.tvStatus)\n\n        startKeepAliveService()\n\n        btnToggle.setOnClickListener {\n            startKeepAliveService()\n            tvStatus.text = "Trạng thái: ĐÃ LÀM MỚI KẾT NỐI GMS"\n        }\n    }\n\n    private fun startKeepAliveService() {\n        val intent = Intent(this, KeepAliveService::class.java)\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            startForegroundService(intent)\n        } else {\n            startService(intent)\n        }\n    }\n}\n' > app/src/main/java/com/example/fcmkeepalive/MainActivity.kt

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FCM-KeepAlive-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          
